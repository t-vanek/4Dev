name: araz

# One-PC development installation. Run scripts/configure-local-server.ps1 first.
# .env and .runtime contain private credentials/certificates. SQL volumes survive rebuilds.
# Control monitors Docker peers; Compose manages their processes.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: araz-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Run scripts/configure-local-server.ps1 first}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:11433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ${BACKUP_DIRECTORY:-.}:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  mssql-importer:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: araz-mssql-importer
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      SQL_HOST: mssql
      LOCAL_TOPOLOGY_FILE: /local/configure-topology.sql
    volumes:
      - ./Database:/Database:ro
      - ./.runtime/configure-topology.sql:/local/configure-topology.sql:ro
    entrypoint: ["/bin/bash", "/Database/run-migrations.sh"]
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: araz-mailpit
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_TLS_CERT: /run/certs/cert.pem
      MP_SMTP_TLS_KEY: /run/certs/key.pem
      MP_SMTP_REQUIRE_TLS: "true"
    volumes:
      - mailpit-data:/data
      - ./.runtime/certs/mailpit/cert.pem:/run/certs/cert.pem:ro
      - ./.runtime/certs/mailpit/key.pem:/run/certs/key.pem:ro
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  loginsvr:
    build: ./Servers/TLoginSvr.Net
    container_name: araz-loginsvr
    depends_on:
      mssql-importer:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: LocalDocker
      SSL_CERT_FILE: /run/mail-ca/cert.pem
      Login__Port: "4816"
      Login__Db__GlobalConnectionString: "Server=mssql,1433;Database=TGlobal_gsp;User ID=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Login__Db__GameConnectionStringsByDsn__TGAME_GSP: "Server=mssql,1433;Database=TGame_gsp;User ID=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
    volumes:
      - ./.runtime/config/login/appsettings.LocalDocker.json:/app/appsettings.LocalDocker.json:ro
      - ./.runtime/certs/mailpit/cert.pem:/run/mail-ca/cert.pem:ro
    ports:
      - "127.0.0.1:4816:4816"
    restart: unless-stopped

  worldsvr:
    build: ./Servers/TWorldSvr.Net
    container_name: araz-worldsvr
    depends_on:
      mssql-importer:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: LocalDocker
      World__Port: "3816"
      World__GroupID: "1"
      World__ServerID: "1"
      World__Db__GameConnectionString: "Server=mssql,1433;Database=TGame_gsp;User ID=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      World__Db__GlobalConnectionString: "Server=mssql,1433;Database=TGlobal_gsp;User ID=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
    volumes:
      - ./.runtime/config/world/appsettings.LocalDocker.json:/app/appsettings.LocalDocker.json:ro
      - ./.runtime/certs/worldsvr/identity.pfx:/run/certs/identity.pfx:ro
    restart: unless-stopped

  mapsvr:
    build: ./Servers/TMapSvr.Net
    container_name: araz-mapsvr
    depends_on:
      mssql-importer:
        condition: service_completed_successfully
      worldsvr:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: LocalDocker
      Map__Port: "5816"
      Map__WorldIp: worldsvr
      Map__WorldPort: "3816"
      Map__GroupId: "1"
      Map__ServerId: "1"
      Map__Channels__0: "1"
      Map__Db__GameConnectionString: "Server=mssql,1433;Database=TGame_gsp;User ID=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Map__Db__GlobalConnectionString: "Server=mssql,1433;Database=TGlobal_gsp;User ID=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
    volumes:
      - ./.runtime/config/map/appsettings.LocalDocker.json:/app/appsettings.LocalDocker.json:ro
      - ./.runtime/certs/mapsvr/identity.pfx:/run/certs/identity.pfx:ro
    ports:
      - "127.0.0.1:5816:5816"
    restart: unless-stopped

  patchsvr:
    build: ./Servers/TPatchSvr.Net
    container_name: araz-patchsvr
    depends_on:
      mssql-importer:
        condition: service_completed_successfully
    environment:
      Patch__Port: "3716"
      Patch__ServerId: "1"
      Patch__GroupId: "0"
      Patch__Db__ConnectionString: "Server=mssql,1433;Database=TGlobal_gsp;User ID=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Patch__LoginAddress: "127.0.0.1"
      Patch__LoginPort: "4816"
      # No external patch download host is configured for a local source build.
      Patch__FtpUrl: ""
      Patch__PreFtpUrl: ""
    ports:
      - "127.0.0.1:3716:3716"
    restart: unless-stopped

  controlsvr:
    build: ./Servers/TControlSvr.Net
    container_name: araz-controlsvr
    depends_on:
      mssql-importer:
        condition: service_completed_successfully
      worldsvr:
        condition: service_started
      mapsvr:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: LocalDocker
      Control__Port: "3615"
      Control__ConnectIntervalSeconds: "5"
      Control__ProcessStateDirectory: /var/lib/4dev/process-state
      Control__Db__GlobalConnectionString: "Server=mssql,1433;Database=TGlobal_gsp;User ID=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
    volumes:
      - ./.runtime/config/control/appsettings.LocalDocker.json:/app/appsettings.LocalDocker.json:ro
      - ./.runtime/certs/controlsvr/identity.pfx:/run/certs/identity.pfx:ro
      - control-state:/var/lib/4dev
    ports:
      - "127.0.0.1:3615:3615"
    restart: unless-stopped

volumes:
  mssql-data:
  mailpit-data:
  control-state:
