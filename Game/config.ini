; 4Story client + launcher configuration.
; Replaces the old Windows-registry settings. Lives next to the game/launcher exe.
; Values here mirror the CGameConfig defaults table (Lib/Own/GameConfig/GameConfig.cpp).
; The client also writes [Keys], [CustomUI] and [ChatInterface] here automatically on first run.

[Settings]
; --- display ---
BGFXRenderer=D3D12
WindowedMode=TRUE
UseShader=FALSE
ScreenX=3440
ScreenY=1440
SwapEffect=3
PresentationInterval=-2147483648
Behavior=132
TextureDetail=2
; --- graphics quality ---
MapDETAIL=1
ObjDETAIL=2
MapSHADOW=1
ObjSHADOW=1
MapSFX=1
SfxDETAIL=1
DLIGHTMAP=1
FLIGHTMAP=0
FarIMAGE=1
OBJRange=0.794000
; --- monster name grouping: same-name monsters close together share one "Name xN" label ---
GroupMonNames=1
; closer than this (game units) every monster keeps its own name
GroupMonNamesNear=20.0
; merge radius on the ground = ratio x distance to you (bigger = more grouping)
GroupMonNamesRatio=0.5
; --- audio ---
MASTER=1
MainVolume=75
BGM=1
BGMVolume=25
SOUND=1
SFXVolume=75
; --- gameplay / UI ---
NpcNAME=1
MonNAME=1
PcNAME=1
AUTOHELP=1
TALKBOX=1
HUD=1
DENYWHI=0
DENYCOM=0
CONCHAT=0
MOUSECLICKMOVE=1
AUTOTARGETING=1
; --- fonts ---
Font=
FontSize=100
FontQuality=ANTIALIASED_QUALITY
FIRST=0
Reset=1
DISABLE_DOUBLE_SKILL=0
DISABLE_OTHER_COMPANIONS=0
DISABLE_TOURNAMENT_AUDIENCE=0
DISABLE_ARENA_AUDIENCE=0
DISABLE_DUEL_AUDIENCE=0
DISABLE_AUTO_SELECT_SFX=0
DISABLE_CHAT_TRANSPARENCY=0
SHOW_CAUTION_15=1
UTILITYBAR=1

[Launcher]
; Patch configuration. Set 'address'/'port' to your patch server; 'directory' empty
; defaults to the launcher's own folder at runtime.
version=0
directory=
exe=TClient.exe
address=127.0.0.1
port=3716
disclaimer=TRUE
PrePatchFirst=1
PrePatchAutoStart=0
